name: Desktop app

# Build the downloadable DNAKit desktop app on Windows, macOS and Linux with
# desktop-app/build.py, run each packaged app (in-app checks and a window that must render),
# and publish the files as the assets of the "desktop" GitHub release. The download links in
# the README point at that release, so every successful run on main updates what users download.

on:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - "src/dnakit/gui/**"
      - "src/dnakit/cli/gui.py"
      - "src/dnakit/_version.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Replace the files of the desktop release with this build"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux is built on the oldest runner so that the app starts on glibc 2.35 and newer.
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux display and Qt libraries
        if: runner.os == 'Linux'
        run: |
          packages="xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1
            libxcb-xkb1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-image0
            libxcb-render-util0 libegl1 libnss3 libasound2"
          install() {
            sudo timeout 300 apt-get update && sudo timeout 600 apt-get install -y $packages
          }
          report() {  # show the end of the apt output on the run page
            tail -n 40 apt.log
            echo "::$1 title=apt-get::$(tail -n 20 apt.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          }
          if ! install > apt.log 2>&1; then
            report warning
            # The runner's default mirror is sometimes unreachable; use the main archive.
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' \
              /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* \
              2> /dev/null || true
            if ! install > apt.log 2>&1; then
              report error
              exit 1
            fi
          fi

      - name: Build, test and package the app
        run: python desktop-app/build.py --install

      - name: Upload the download
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            desktop-app/dist/DNAKit-*.zip
            desktop-app/dist/DNAKit-*.dmg
            desktop-app/dist/DNAKit-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test report and window screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.os }}
          path: |
            desktop-app/dist/smoke-report.json
            desktop-app/dist/test-output.log
            desktop-app/dist/window-*.png
          if-no-files-found: warn

  publish:
    name: Publish the downloads
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download the built apps
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: downloads
          merge-multiple: true

      - name: Replace the files of the desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__.*"\(.*\)"/\1/p' src/dnakit/_version.py)
          files=$(ls downloads/DNAKit-*.zip downloads/DNAKit-*.dmg downloads/DNAKit-*.tar.gz)
          {
            echo "Built from DNAKit ${version} (commit ${GITHUB_SHA::7}) on $(date -u +%Y-%m-%d)."
            echo
            cat desktop-app/RELEASE_NOTES.md
          } > notes.md
          if gh release view desktop > /dev/null 2>&1; then
            gh release upload desktop $files --clobber
            gh release edit desktop --title "DNAKit desktop app" --notes-file notes.md
          else
            gh release create desktop $files --title "DNAKit desktop app" \
              --notes-file notes.md --target "$GITHUB_SHA" --latest=false
          fi
