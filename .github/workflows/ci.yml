name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core package and test tools
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Run unit and integration tests
        env:
          PYTHONNOUSERSITE: "1"
        run: python -m pytest

  quality-docs-validation:
    name: Quality, optional integrations, docs, and validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install all supported extras
        run: >-
          python -m pip install --upgrade pip
          ".[dev,docs,io,validation,viz]"

      - name: Check formatting
        run: python -m ruff format --check src others/tests others/validation benchmarks

      - name: Lint
        run: python -m ruff check src others/tests others/validation benchmarks

      - name: Type check (advisory)
        continue-on-error: true
        run: python -m mypy

      - name: Test with all supported extras
        env:
          PYTHONNOUSERSITE: "1"
        run: python -m pytest

      - name: Execute tutorial notebooks
        env:
          PYTHONNOUSERSITE: "1"
        run: python -m pytest --nbmake others/notebooks

      - name: Build documentation strictly
        env:
          PYTHONNOUSERSITE: "1"
        run: python -m mkdocs build --strict --config-file mkdocs.yml

      - name: Run local correctness validation
        env:
          PYTHONNOUSERSITE: "1"
        run: >-
          python -m others.validation.run_validation
          --output "${RUNNER_TEMP}/dnakit-validation.json"
          --force

      - name: Verify user-site isolation contract
        env:
          PYTHONNOUSERSITE: "1"
        run: >-
          python -c "import site,sys;
          assert site.ENABLE_USER_SITE is False;
          assert not any('/.local/' in p for p in sys.path)"

  package:
    name: Build distributions
    needs: [test, quality-docs-validation]
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*
