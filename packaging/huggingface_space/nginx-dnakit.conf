# nginx front end for the self-hosted DNAKit web demo (/etc/nginx/sites-available/dnakit).
#
# * Shows a lightweight "Loading" splash as soon as the HTML arrives (injected after <head>),
#   so visitors see the page immediately while Gradio's scripts load.
# * Serves Gradio's content-hashed front-end files from disk with one-year browser caching,
#   so repeat visits load almost instantly.
# * Compresses HTML, JS, CSS and JSON; proxies everything else to Gradio on 127.0.0.1:7860.
#
# The splash text must not contain "$" (nginx would read it as a variable), single quotes or
# escaped double quotes (nginx unescapes them, which breaks the inline JavaScript string).

upstream dnakit_gradio {
    server 127.0.0.1:7860;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Gradio front-end bundles: file names contain a content hash, so they can be cached for a year.
    location /assets/ {
        # Symlink to <venv>/lib/pythonX.Y/site-packages/gradio/templates/frontend (see packaging/README.md).
        root /opt/dnakit-web/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @gradio;
    }

    # Main page: inject the splash right after <head>.
    location = / {
        proxy_pass http://dnakit_gradio;
        # A location with its own proxy_set_header does not inherit the server-level ones.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '<head>' '<head><style>#dk-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f8fafc;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;transition:opacity .3s}#dk-splash h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.5px}#dk-splash p{margin:0;font-size:15px;color:#6b7280;text-align:center;max-width:520px;padding:0 16px}#dk-splash .dk-bar{width:220px;height:4px;border-radius:2px;background:#e5e7eb;overflow:hidden}#dk-splash .dk-bar:after{content:"";display:block;width:40%;height:100%;background:#3b82f6;border-radius:2px;animation:dk-slide 1.1s ease-in-out infinite}@keyframes dk-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}@media (prefers-color-scheme:dark){#dk-splash{background:#0b0f19;color:#e5e7eb}#dk-splash .dk-bar{background:#1f2937}}</style><script>(function(){var d=document.createElement("div");d.id="dk-splash";d.innerHTML="<img src=/favicon.ico width=88 height=88 alt=DNAKit><h1>DNAKit</h1><p>A unified DNA toolkit for Python, the command line and AI agents</p><div class=dk-bar></div><p style=font-size:13px>Loading the interface…</p>";document.documentElement.appendChild(d);var t0=Date.now();var timer=setInterval(function(){if(document.getElementById("hero")||Date.now()-t0>60000){clearInterval(timer);d.style.opacity="0";setTimeout(function(){d.remove()},300)}},100)})();</script>';
        add_header Cache-Control "no-cache";
    }

    # Gradio API, queue (server-sent events) and file transfers: no buffering, long timeouts.
    location / {
        proxy_pass http://dnakit_gradio;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location @gradio {
        proxy_pass http://dnakit_gradio;
    }
}
