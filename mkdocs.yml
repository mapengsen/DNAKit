                - "11) Statistical, Differential and Enrichment Analysis":
                    - "1. Statistical and Differential Analysis": api/features/31_statistical_analysis.md
                    - "2. Gene Set and Pathway Enrichment": api/features/37_functional_enrichment.md
                - 12) Sequencing Data Analysis: api/features/32_sequencing_analysis.md
                - "13) Variant Calling, Annotation and Scoring":
                    - "1. Variant Calling and Statistics": api/features/33_variant_calling.md
                    - "2. Variant Annotation and Identifier Conversion": api/features/35_variant_annotation.md
                    - "3. Variant Effect Scores and Experimental Data": api/features/36_variant_effect_scores.md
                - 14) Inheritance Simulation: api/features/34_inheritance.md
                - 15) Genomics and DNA Engineering: api/features/38_genomics_extensions.md
                - 16) External Genomics and MCP: api/features/39_external_genomics.md
            - 4. Data Evaluation:
