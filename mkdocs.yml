site_name: DNAKit
site_url: https://mapengsen.github.io/DNAKit/
site_description: 面向 DNA 序列的确定性分析工具包
site_author: DNAKit contributors
copyright: Support by Pengsen Ma (Hunan University, Yuelushan Laboratory), https://github.com/mapengsen/DNAKit
docs_dir: docs
site_dir: site
strict: true
hooks:
  - others/hooks/mcp_setup.py
watch:
  - setup.md
not_in_nav: |
  /agent_tools*.md
  /quickstart.md
  /tutorials/*
  /examples/index.md
  /validation.md
  /demo/index.md
  /planning/*
  /api/features/03_validation.md
  /api/features/05_descriptors.md
  /api/features/16_common_genomes.md
  /api/features/04_ops_007_trimming_masking.md
  /api/features/08_neural_representations.md

theme:
  name: material
  language: zh
  custom_dir: others/overrides
  logo: assets/images/DNAKit-icon.png
  favicon: assets/images/DNAKit-icon.png
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          site_description: A reproducible toolkit for DNA sequence analysis
          nav:
            - Home: index.md
            - Installation: installation.md
            - Quick Start Tutorial:
                - Feature Tree Overview: api/features/function_tree.md
                - Feature Module Index: api/features/index.md
                - 1. Data Preparation:
                    - (1) Core Data Objects: api/features/01_core_objects.md
                    - (2) File I/O: api/features/02_io_data.md
                    - (3) Downloads: api/features/15_download.md
                    - (4) Data Queries: api/features/22_database_query.md
                    - (5) Validation: api/features/03_validation.md
                    - (6) Database and sequencing extensions:
                        - Genes, sequences and downloads: api/native/sequences.md
                        - ENCODE data management: api/native/encode.md
                        - Organisms and microbiomes: api/native/organisms.md
                        - Literature and study discovery: api/native/literature.md
                - 2. Data Processing:
                    - Unified Input and Output: api/features/00_processing_inputs.md
                    - (1) DNA Sequence Standardization: api/features/03_standardization.md
                    - (2) Intra-sequence Operations:
                        - OPS-001 Sequence Direction Completion: api/features/04_ops_001_sequence_direction.md
                        - OPS-002 Transcription and Translation: api/features/04_ops_002_transcription_translation.md
                        - OPS-003 Subsequence Extraction: api/features/04_ops_003_subsequence_extraction.md
                        - OPS-004 Sequence Editing: api/features/04_ops_004_sequence_editing.md
                        - OPS-005 Sequence Generation: api/features/04_ops_005_mutation_generation.md
                        - OPS-006 Sequence Concatenation: api/features/04_ops_006_sequence_concatenation.md
                        - OPS-007:
                            - Trimming: api/features/04_ops_007_trimming.md
                            - Masking: api/features/04_ops_007_masking.md
                        - OPS-008 Circular Sequence Operations: api/features/04_ops_008_circular_sequence_operations.md
                        - OPS-010 Sequence Chunking: api/features/17_sequence_chunking.md
                    - (3) Sequence Deduplication: api/features/10_deduplication.md
                    - (4) Sequence Clustering: api/features/10_clustering.md
                    - (5) Dataset Preparation and Splitting: api/features/10_datasets.md
                - 3. Data Analysis:
                    - (1) DNA Descriptors, Representations, and Fingerprints:
                        - DNA Descriptors: api/features/05_all_descriptors.md
                        - Sequence Representations: api/features/08_fingerprints.md
                        - DNA Fingerprints: api/features/08_feature_engineering.md
                    - (2) Sequence Search:
                        - General Search: api/features/09_search.md
                        - Functional Sequence Search: api/features/06_patterns.md
                    - (3) Physicochemical Properties: api/features/07_physicochemical.md
                    - (4) Duplex Thermodynamics: api/features/19_duplex_thermodynamics.md
                    - (5) Secondary Structure: api/features/20_secondary_structure.md
                    - (6) 3D Structure and Mechanics: api/features/21_structure3d.md
                    - (7) Optical and Concentration Conversions: api/features/18_optics_concentration.md
                    - (8) Deep-learning Property Prediction: api/features/23_deep_learning_property_prediction.md
                    - (9) Optional Bioinformatics Functions: api/features/24_optional_bioinformatics.md
                    - (10) Gene Names and Intervals: api/features/26_gene_annotation.md
                    - (11) Bioinformatics Python APIs: api/features/27_bioinformatics.md
                    - (12) Database analysis and prediction APIs:
                        - Variants and GWAS: api/native/variants.md
                        - Diseases and phenotypes: api/native/phenotypes.md
                        - Expression and regulation: api/native/regulation.md
                        - Pathways, interactions and structures: api/native/pathways.md
                        - Targets and drug evidence: api/native/targets.md
                        - Trained models: api/native/models.md
                        - Sequence analysis and inheritance: api/native/analysis.md
                - 4. Data Evaluation:
                    - (1) Common Evaluation Metrics: api/features/12_evaluation.md
                    - (2) Similarity Calculation: api/features/09_similarity_alignment.md
                    - (3) Sequence Distance and Alignment: api/features/09_alignment.md
                - 5. Visualization: api/features/13_visualization.md
                - 6. Engineering and Extensions:
                    - Backends, performance and reproducibility: api/features/14_engineering.md
                    - API discovery, workflows and reports: api/native/execution.md
            - API Reference:
                - API Overview: api/index.md
                - All 484 added functions: api/native/index.md
                - Calling conventions and examples: api/native/usage.md
            - LLM Tools:
                - (1) MCP: llm_tools/mcp.md
                - (2) Python API: llm_tools/python_api.md
                - (3) Skills: llm_tools/skills.md
                - (4) Native Skill APIs: llm_tools/native_skills.md
            - Changelog: changelog.md
            - FAQ: faq.md
            - WeChat Community: wechat.md
            - Acknowledgements: acknowledgements.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  collapsible_nav:
    - 大模型工具
    - LLM Tools

nav:
  - 首页: index.md
  - 安装: installation.md
  - 快速入门教程:
      - 功能树总览: api/features/function_tree.md
      - 功能模块索引: api/features/index.md
      - 1. 数据准备:
          - （1）核心数据对象: api/features/01_core_objects.md
          - （2）文件读写: api/features/02_io_data.md
          - （3）下载: api/features/15_download.md
          - （4）数据查询: api/features/22_database_query.md
          - （5）合法性检查: api/features/03_validation.md
          - （6）数据库与测序扩展:
              - 基因、序列与下载: api/native/sequences.md
              - ENCODE 数据管理: api/native/encode.md
              - 物种与微生物组: api/native/organisms.md
              - 文献与研究检索: api/native/literature.md
      - 2. 数据处理:
          - 统一输入与输出: api/features/00_processing_inputs.md
          - （1）DNA序列标准化: api/features/03_standardization.md
          - （2）序列内操作:
              - OPS-001 序列补全: api/features/04_ops_001_sequence_direction.md
              - OPS-002 转录与翻译: api/features/04_ops_002_transcription_translation.md
              - OPS-003 子序列提取: api/features/04_ops_003_subsequence_extraction.md
              - OPS-004 序列编辑: api/features/04_ops_004_sequence_editing.md
              - OPS-005 序列生成: api/features/04_ops_005_mutation_generation.md
              - OPS-006 序列拼接: api/features/04_ops_006_sequence_concatenation.md
              - OPS-007:
                  - Trimming（修剪）: api/features/04_ops_007_trimming.md
                  - Masking（掩蔽）: api/features/04_ops_007_masking.md
              - OPS-008 环状序列操作: api/features/04_ops_008_circular_sequence_operations.md
              - OPS-010 序列切分: api/features/17_sequence_chunking.md
          - （3）序列去重: api/features/10_deduplication.md
          - （4）序列聚类: api/features/10_clustering.md
          - （5）数据集整理与划分: api/features/10_datasets.md
      - 3. 数据分析:
          - （1）DNA描述符+表征+指纹:
              - DNA描述符: api/features/05_all_descriptors.md
              - 序列表征: api/features/08_fingerprints.md
              - DNA指纹: api/features/08_feature_engineering.md
          - （2）序列搜索:
              - 通用搜索: api/features/09_search.md
              - 序列功能搜索: api/features/06_patterns.md
          - （3）理化性质: api/features/07_physicochemical.md
          - （4）双链热力学扩展: api/features/19_duplex_thermodynamics.md
          - （5）二级结构性质: api/features/20_secondary_structure.md
          - （6）三维结构与力学性质: api/features/21_structure3d.md
          - （7）换算: api/features/18_optics_concentration.md
          - （8）深度学习性质预测: api/features/23_deep_learning_property_prediction.md
          - （9）可选生物信息功能: api/features/24_optional_bioinformatics.md
          - （10）基因名称与区间注释: api/features/26_gene_annotation.md
          - （11）生物信息学 Python API: api/features/27_bioinformatics.md
          - （12）数据库分析与预测接口:
              - 遗传变异与 GWAS: api/native/variants.md
              - 疾病与表型: api/native/phenotypes.md
              - 表达与调控: api/native/regulation.md
              - 通路、互作与结构: api/native/pathways.md
              - 靶点与药物证据: api/native/targets.md
              - 已训练模型: api/native/models.md
              - 序列计算与遗传模拟: api/native/analysis.md
      - 4. 数据评价:
          - （1）常用评价指标: api/features/12_evaluation.md
          - （2）相似度计算: api/features/09_similarity_alignment.md
          - （3）序列距离与比对: api/features/09_alignment.md
      - 5. 可视化: api/features/13_visualization.md
      - 6. 工程化与扩展:
          - 后端、性能与复现: api/features/14_engineering.md
          - 接口发现、工作流与报告: api/native/execution.md
  - API 参考:
      - API 总览: api/index.md
      - 新增 484 个函数完整索引: api/native/index.md
      - 调用约定与完整示例: api/native/usage.md
  - 大模型工具:
      - （1）MCP: llm_tools/mcp.md
      - （2）Python API: llm_tools/python_api.md
      - （3）Skills: llm_tools/skills.md
      - （4）Skill 统一接口: llm_tools/native_skills.md
  - 更新日志: changelog.md
  - FAQ: faq.md
  - 微信社区: wechat.md
  - 致谢: acknowledgements.md
