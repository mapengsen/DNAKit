site_name: DNAKit
site_url: https://mapengsen.github.io/DNAKit/
site_description: 面向 DNA 序列的确定性分析工具包
site_author: DNAKit contributors
copyright: Support by Pengsen Ma (Hunan University, Yuelushan Laboratory), https://github.com/mapengsen/DNAKit
docs_dir: docs
site_dir: site
strict: true
hooks:
  - others/hooks/mcp_setup.py
watch:
  - setup.md
not_in_nav: |
  /agent_tools*.md
  /tutorials/*
  /examples/index.md
  /validation.md
  /demo/index.md
  /planning/*
  /api/features/03_validation.md
  /api/features/05_descriptors.md
  /api/features/16_common_genomes.md
  /api/features/08_neural_representations.md

theme:
  name: material
  language: zh
  custom_dir: others/overrides
  logo: assets/images/DNAKit-icon.png
  favicon: assets/images/DNAKit-icon.png
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          site_description: A reproducible toolkit for DNA sequence analysis
          nav:
            - Home: index.md
            - Installation: installation.md
            - Graphical Interface: gui.md
