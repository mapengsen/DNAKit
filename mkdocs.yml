site_name: DNAKit
site_url: https://mapengsen.github.io/DNAKit/
site_description: 面向 DNA 序列的确定性分析工具包
site_author: DNAKit contributors
copyright: Support by Pengsen Ma (Hunan University, Yuelushan Laboratory), https://github.com/mapengsen/DNAKit
docs_dir: docs
site_dir: site
strict: true
hooks:
  - others/hooks/mcp_setup.py
watch:
  - setup.md
not_in_nav: |
  /agent_tools*.md
  /tutorials/*
  /examples/index.md
  /validation.md
  /demo/index.md
  /planning/*
  /api/features/03_validation.md
  /api/features/05_descriptors.md
  /api/features/16_common_genomes.md
  /api/features/08_neural_representations.md

theme:
  name: material
  language: zh
  custom_dir: others/overrides
  logo: assets/images/DNAKit-icon.png
  favicon: assets/images/DNAKit-icon.png
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          site_description: A reproducible toolkit for DNA sequence analysis
          nav:
            - Home: index.md
            - Installation: installation.md
            - Feature Tree Overview: api/features/function_tree.md
            - 1. Data Preparation:
                - 1) Core Data Objects: api/features/01_core_objects.md
                - 2) File I/O: api/features/02_io_data.md
                - 3) Downloads: api/features/15_download.md
                - 4) Data Queries:
                    - 1. Discover and Call APIs: api/features/22_database_query_discovery.md
                    - 2. Sequences, Assemblies and Sequencing: api/features/22_database_query_sequences.md
                    - 3. Diseases, Phenotypes and Ontologies: api/features/22_database_query_phenotypes.md
                    - 4. Expression, Regulation and Cancer: api/features/22_database_query_regulation.md
                    - 5. Organisms, Taxonomy and Microbiomes: api/features/22_database_query_organisms.md
                    - 6. Pathways, Interactions, Proteins and Structures: api/features/22_database_query_pathways.md
                    - 7. Targets, Drugs and Associations: api/features/22_database_query_targets.md
                    - 8. Literature, Preprints and Clinical Studies: api/features/22_database_query_literature.md
                    - 9. ENCODE Experiments and Files: api/features/22_database_query_encode.md
                    - "10. Genetic Variants and Population Associations":
                        - "1) Variant Records and Population Frequencies": api/features/22_database_query_variant_frequency.md
                        - "2) Structural Variant Queries": api/features/22_database_query_structural_variants.md
                        - "3) ClinVar Clinical Significance": api/features/22_database_query_clinical_variants.md
                        - "4) Gene–Disease Evidence, Dosage and Actionability": api/features/22_database_query_genetic_evidence.md
                        - "5) Cancer Variants and Treatment Evidence": api/features/22_database_query_cancer_variants.md
                        - "6) GWAS Studies and Associations": api/features/22_database_query_gwas.md
                        - "7) Cohort Phenotype Associations and Fine-mapping": api/features/22_database_query_phewas.md
                        - "8) Populations, Samples and Linkage Disequilibrium": api/features/22_database_query_population_resources.md
                - 5) Validation: api/features/03_validation.md
            - 2. Data Processing:
                - 1) DNA Sequence Standardization: api/features/03_standardization.md
                - 2) Intra-sequence Operations:
                    - 1. Sequence Direction Completion: api/features/04_ops_001_sequence_direction.md
                    - 2. Transcription and Translation: api/features/04_ops_002_transcription_translation.md
                    - 3. Subsequence Extraction: api/features/04_ops_003_subsequence_extraction.md
                    - 4. Sequence Editing: api/features/04_ops_004_sequence_editing.md
