  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  collapsible_nav:
    - 1. 数据准备
    - 2. 数据处理
    - 3. 数据分析
    - 4. 数据评价
    - 1. Data Preparation
    - 2. Data Processing
    - 3. Data Analysis
    - 4. Data Evaluation
    - 6. 大语言模型工具
    - 6. Large Language Model Tools
    - FAQ

