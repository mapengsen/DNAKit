[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnakit"
dynamic = ["version"]
description = "Deterministic tools for DNA sequence analysis"
readme = "README.md"
license = "MIT AND MIT-0 AND Apache-2.0 AND CC-BY-4.0 AND AGPL-3.0-only"
license-files = ["LICENSE", "DISCLAIMER.md", "THIRD_PARTY_NOTICES.md", "licenses/skills/*/*"]
authors = [{ name = "DNAKit contributors" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
  "typer>=0.12",
  "requests>=2.32,<3",
  "jsonschema>=4.23,<5",
  "graphql-core>=3.2,<4",
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "opentelemetry-sdk>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/mapengsen/DNAKit"
Documentation = "https://mapengsen.github.io/DNAKit/en/"
Repository = "https://github.com/mapengsen/DNAKit"
Issues = "https://github.com/mapengsen/DNAKit/issues"
Changelog = "https://mapengsen.github.io/DNAKit/en/changelog/"

[project.optional-dependencies]
reports = ["reportlab>=4,<5"]
encode-credentials = ["keyring>=25,<26", "cryptography>=42"]

bio-analysis = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2"]
bio-formats = ["biopython>=1.85,<2"]
bio-reads = ["pysam>=0.22,<0.25"]
bio-plots = ["matplotlib>=3.8,<4"]
bio-assembly = ["pydna>=5.5,<6"]
bio = ["dnakit[bio-analysis,bio-formats,bio-reads,bio-plots,bio-assembly]"]
bio-validation = ["scikit-bio>=0.7.3,<0.8", "statsmodels>=0.14,<1"]
genomics-genes = ["pyrodigal>=3.7,<4"]
genomics = [
  "numpy>=1.26,<3",
  "pyrodigal>=3.7,<4",
  "pysam>=0.22,<0.25",
  "pyfastani>=0.6.2,<0.7",
]
dna-storage = ["Chamaeleo>=1.34,<2"]
dna-nanotechnology = ["scadnano>=0.21,<1"]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "numpy>=1.26,<3",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "scikit-learn>=1.5,<2",
  "setuptools>=77",
  "twine>=5.0",
  "types-PyYAML>=6.0",
  "wheel",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocs-static-i18n>=1.3.1,<2",
  "mkdocstrings[python]>=0.27,<1",
  "nbmake>=1.5,<2",
]
viz = [
  "CairoSVG>=2.7,<3",
  "Pillow>=10,<13",
]
io = [
  "pyarrow>=19,<26",
]
validation = [
  "biopython>=1.85,<2",
]
external-tools = [
  "biopython>=1.85,<2",
]
agent = [
  "fastmcp>=3.4.5,<4",
  "httpx[socks]>=0.27,<1",
]
neural = [
  "gdown>=5.2,<6",
  "huggingface-hub>=0.28,<2",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "transformers>=4.49,<5",
]
training = [
  "huggingface-hub>=0.28,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=19,<26",
  "scikit-learn>=1.5,<2",
  "torch>=2.6,<3",
  "transformers>=4.49,<5",
  "xlrd>=2.0,<3",
]
ml = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "threadpoolctl>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=19,<26",
  "xlrd>=2.0,<3",
]
xgboost = ["dnakit[ml]", "xgboost>=2.1,<4"]
lightgbm = ["dnakit[ml]", "lightgbm>=4.5,<5"]
catboost = ["dnakit[ml]", "catboost>=1.2,<2"]
neural-caduceus = [
  "mamba-ssm>=2.2,<3",
]
neural-enformer = [
  "gdown>=5.2,<6",
  "enformer-pytorch>=0.8.11,<1",
]
neural-evo2 = [
  "evo2>=0.5.3,<0.7; python_version >= '3.11' and python_version < '3.13'",
]

[project.scripts]
dnakit = "dnakit.cli.app:run"
dnakit-mcp = "dnakit.tools.server:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "dnakit._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dnakit = ["py.typed"]
"dnakit.databases" = ["providers.json"]
"dnakit.integrations" = ["*.json"]
"dnakit.generated" = ["manifest.json"]
"dnakit.tools" = ["_data/*.json"]
"dnakit.encode._backend" = ["LICENSE", "UPSTREAM.json"]
"dnakit.workflows.common" = ["LICENSE", "UPSTREAM.json"]
"dnakit.workflows.prs" = ["LICENSE", "UPSTREAM.json", "*.json", "*.txt", "data/*.txt"]
"dnakit.workflows.support" = ["LICENSE", "UPSTREAM.json", "**/*.json", "**/*.txt", "**/*.csv", "**/*.tsv", "**/*.vcf", "**/*.md"]
"dnakit.databases._providers" = ["LICENSE", "UPSTREAM.json", "data/*.json", "data/*.graphql", "data/*.gql"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["others/tests"]

[tool.coverage.run]
branch = true
source = ["dnakit"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = ["src", "others/tests"]
strict = true
warn_unreachable = true
exclude = [
  "src/dnakit/databases/_providers/",
  "src/dnakit/encode/_backend/",
  "src/dnakit/workflows/(common|prs|support)/",
]

[[tool.mypy.overrides]]
# Preserve upstream scientific implementations; check DNAKit's public adapters separately.
module = [
  "dnakit.databases._providers.*", "dnakit.encode._backend.*",
  "dnakit.workflows.common.*", "dnakit.workflows.prs.*", "dnakit.workflows.support.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["reportlab.*", "jsonschema", "jsonschema.*", "cellxgene_census", "pandas.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "others/tests"]
extend-exclude = ["build", "dist", "dashing_similarity", "site", "src/dnakit/databases/_providers", "src/dnakit/databases/_generated.py", "src/dnakit/encode/_backend", "src/dnakit/encode/__init__.py", "src/dnakit/workflows/common", "src/dnakit/workflows/prs", "src/dnakit/workflows/support"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# These maintainers embed source-code patterns and generated documentation verbatim.
"others/skills/build_genomics_survey.py" = ["E501", "RUF001"]
"others/skills/build_native_providers.py" = ["E501"]
"others/skills/build_support_backends.py" = ["E501"]
"others/skills/build_workflow_backends.py" = ["E501"]
"others/skills/prepare_all_adaptations.py" = ["E501"]
"others/skills/finalize_adaptations.py" = ["E501"]
"others/skills/workflow_corrections.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true
