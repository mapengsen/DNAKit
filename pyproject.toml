[project.scripts]
dnakit = "dnakit.cli.app:run"
dnakit-mcp = "dnakit.tools.server:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "dnakit._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dnakit = ["py.typed"]
"dnakit.databases" = ["providers.json"]
"dnakit.integrations" = ["*.json"]
"dnakit.generated" = ["manifest.json"]
"dnakit.tools" = ["_data/*.json"]
"dnakit.encode._backend" = ["LICENSE", "UPSTREAM.json"]
"dnakit.workflows.common" = ["LICENSE", "UPSTREAM.json"]
"dnakit.workflows.prs" = ["LICENSE", "UPSTREAM.json", "*.json", "*.txt", "data/*.txt"]
"dnakit.workflows.support" = ["LICENSE", "UPSTREAM.json", "**/*.json", "**/*.txt", "**/*.csv", "**/*.tsv", "**/*.vcf", "**/*.md"]
"dnakit.databases._providers" = ["LICENSE", "UPSTREAM.json", "data/*.json", "data/*.graphql", "data/*.gql"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["others/tests"]

[tool.coverage.run]
branch = true
source = ["dnakit"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = ["src", "others/tests"]
strict = true
warn_unreachable = true
exclude = [
  "src/dnakit/databases/_providers/",
  "src/dnakit/encode/_backend/",
  "src/dnakit/workflows/(common|prs|support)/",
]

[[tool.mypy.overrides]]
# Preserve upstream scientific implementations; check DNAKit's public adapters separately.
module = [
  "dnakit.databases._providers.*", "dnakit.encode._backend.*",
  "dnakit.workflows.common.*", "dnakit.workflows.prs.*", "dnakit.workflows.support.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["reportlab.*", "jsonschema", "jsonschema.*", "cellxgene_census", "pandas.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "others/tests"]
extend-exclude = ["build", "dist", "dashing_similarity", "site", "src/dnakit/databases/_providers", "src/dnakit/databases/_generated.py", "src/dnakit/encode/_backend", "src/dnakit/encode/__init__.py", "src/dnakit/workflows/common", "src/dnakit/workflows/prs", "src/dnakit/workflows/support"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# These maintainers embed source-code patterns and generated documentation verbatim.
"others/skills/build_genomics_survey.py" = ["E501", "RUF001"]
"others/skills/build_native_providers.py" = ["E501"]
"others/skills/build_support_backends.py" = ["E501"]
"others/skills/build_workflow_backends.py" = ["E501"]
"others/skills/prepare_all_adaptations.py" = ["E501"]
"others/skills/finalize_adaptations.py" = ["E501"]
"others/skills/workflow_corrections.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true
