[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnakit"
dynamic = ["version"]
description = "Deterministic tools for DNA sequence analysis"
readme = "README.md"
license = "MIT AND MIT-0 AND Apache-2.0 AND CC-BY-4.0 AND AGPL-3.0-only"
license-files = ["LICENSE", "DISCLAIMER.md", "THIRD_PARTY_NOTICES.md", "licenses/skills/*/*"]
authors = [{ name = "DNAKit contributors" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
  "typer>=0.12",
  "requests>=2.32,<3",
  "jsonschema>=4.23,<5",
  "graphql-core>=3.2,<4",
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "opentelemetry-sdk>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/mapengsen/DNAKit"
Documentation = "https://mapengsen.github.io/DNAKit/en/"
Repository = "https://github.com/mapengsen/DNAKit"
Issues = "https://github.com/mapengsen/DNAKit/issues"
Changelog = "https://mapengsen.github.io/DNAKit/en/changelog/"

[project.optional-dependencies]
reports = ["reportlab>=4,<5"]
encode-credentials = ["keyring>=25,<26", "cryptography>=42"]

bio-analysis = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2"]
